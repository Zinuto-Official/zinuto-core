name: Shared Contracts Gate

on:
  pull_request:
    paths:
      - ".github/workflows/shared-contracts.yml"
      - "contracts/**"
      - "packages/shared/**"
      - "tools/contracts/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/shared-contracts.yml"
      - "contracts/**"
      - "packages/shared/**"
      - "tools/contracts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-contracts:
    name: Shared Contracts Quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run shared contracts quality gate
        run: npm run quality:shared-contracts
