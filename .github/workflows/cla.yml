name: Contributor License Agreement

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      actor:
        description: GitHub login to validate manually
        required: true
        type: string

permissions:
  contents: read

jobs:
  cla:
    name: CLA acknowledgement
    if: github.event_name != 'pull_request_target' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      CLA_ACTOR: ${{ github.event.pull_request.user.login || inputs.actor }}
    steps:
      - name: Check out trusted base scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate pull-request author against the trusted base registry
        if: env.CLA_ACTOR != 'Zinuto'
        run: >-
          node tools/open-source/check-cla-signature.mjs
          --actor "${{ env.CLA_ACTOR }}"
          --file contributors/cla-signatures.json

      - name: Confirm sole administrator change policy
        if: env.CLA_ACTOR == 'Zinuto'
        run: echo "Sole administrator changes are exempt from external-contributor CLA lookup; required checks still apply."
