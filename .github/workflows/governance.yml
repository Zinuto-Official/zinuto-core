# SPDX-License-Identifier: GPL-3.0-only

name: Governance

on:
  pull_request:
    paths:
      - ".github/**"
      - "*.md"
      - "LICENSE"
      - "NOTICE"
      - "contributors/**"
      - "docs/**"
      - "documentation-manifest.json"
      - "package.json"
      - "package-lock.json"
      - "sbom.cdx.json"
      - "tools/docs/**"
      - "tools/gen/**"
      - "tools/open-source/**"
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "*.md"
      - "LICENSE"
      - "NOTICE"
      - "contributors/**"
      - "docs/**"
      - "documentation-manifest.json"
      - "package.json"
      - "package-lock.json"
      - "sbom.cdx.json"
      - "tools/docs/**"
      - "tools/gen/**"
      - "tools/open-source/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-source-governance:
    name: Public Source Governance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.8"
          enable-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run public-source governance gate
        run: npm run quality:governance
