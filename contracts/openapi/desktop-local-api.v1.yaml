# SPDX-License-Identifier: GPL-3.0-only

openapi: 3.1.0
info:
  title: Zinuto Desktop Local API
  version: 1.0.0
  description: >
    Canonical v1 HTTP contract for the local desktop backend reached through the
    Tauri backend_http_request bridge. There are no unversioned aliases.
servers:
  - url: zinuto-desktop://local
    description: Tauri local backend bridge
x-zinuto-contract:
  service: desktop-local-api
  version: v1
  basePath: /api/v1
  defaultResponseKind: json-envelope
components:
  schemas:
    SuccessEnvelope:
      type: object
      required:
        - ok
        - data
      properties:
        ok:
          type: boolean
          const: true
        data:
          description: Route-specific v1 response payload.
    ErrorEnvelope:
      type: object
      required:
        - ok
        - requestId
        - errorCode
        - errorStage
        - cause
        - details
      properties:
        ok:
          type: boolean
          const: false
        requestId:
          type: string
        errorCode:
          type: string
        errorStage:
          type: string
          enum:
            - VALIDATION
            - AUTHORIZATION
            - STARTUP
            - IMPORT
            - ACQUISITION
            - SYNC_CHECK
            - SYSTEM
        cause:
          type: object
          required:
            - code
            - stage
          additionalProperties: false
          properties:
            code:
              type: string
            stage:
              type: string
              enum:
                - VALIDATION
                - AUTHORIZATION
                - STARTUP
                - IMPORT
                - ACQUISITION
                - SYNC_CHECK
                - SYSTEM
        details:
          type: object
          additionalProperties: true
          x-zinuto-zod-allow-additional-properties: true
    JsonEnvelope:
      oneOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - $ref: "#/components/schemas/ErrorEnvelope"
    BoundedId:
      type: string
      minLength: 1
      maxLength: 128
    DesktopMarketDataAcquisitionTimeframe:
      type: string
      enum:
        - 1m
        - 5m
        - 1h
        - 1d
    DesktopMarketDataAcquisitionUpstreamTerms:
      type: object
      additionalProperties: false
      required:
        - id
        - upstreamName
        - termsUrl
        - docsUrl
        - termsRevision
      properties:
        id:
          type: string
          enum:
            - eastmoney
            - binance
            - okx
        upstreamName:
          type: string
          minLength: 1
          maxLength: 128
        termsUrl:
          type: string
          minLength: 1
          maxLength: 2048
        docsUrl:
          type: string
          minLength: 1
          maxLength: 2048
        termsRevision:
          type: string
          minLength: 1
          maxLength: 128
    DesktopMarketDataAcquisitionProject:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - url
        - infoUrl
        - version
        - license
      properties:
        id:
          type: string
          enum:
            - aktools
            - akshare
            - ccxt
        name:
          type: string
          minLength: 1
          maxLength: 128
        url:
          type: string
          minLength: 1
          maxLength: 2048
        infoUrl:
          type: string
          minLength: 1
          maxLength: 2048
        version:
          type: string
          minLength: 1
          maxLength: 64
        license:
          type: string
          minLength: 1
          maxLength: 64
    DesktopMarketDataAcquisitionConnectorTerms:
      type: object
      additionalProperties: false
      required:
        - projects
        - upstreams
      properties:
        projects:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: "#/components/schemas/DesktopMarketDataAcquisitionProject"
        upstreams:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: "#/components/schemas/DesktopMarketDataAcquisitionUpstreamTerms"
    DesktopMarketDataAcquisitionConnector:
      type: object
      additionalProperties: false
      required:
        - id
        - version
        - market
        - available
        - unavailabilityCode
        - supportedTimeframes
        - datasets
        - exchanges
        - terms
      properties:
        id:
          type: string
          enum:
            - akshare
            - ccxt
        version:
          type: string
          minLength: 1
          maxLength: 64
        market:
          type: string
          enum:
            - A_SHARE
            - CRYPTO_SPOT
        available:
          type: boolean
        unavailabilityCode:
          type: string
          minLength: 1
          maxLength: 128
          nullable: true
        supportedTimeframes:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: "#/components/schemas/DesktopMarketDataAcquisitionTimeframe"
        datasets:
          type: array
          maxItems: 4
          items:
            type: string
            enum:
              - stock_zh_a_hist
              - stock_zh_a_hist_min_em
              - index_zh_a_hist
        exchanges:
          type: array
          maxItems: 2
          items:
            type: string
            enum:
              - binance
              - okx
        terms:
          $ref: "#/components/schemas/DesktopMarketDataAcquisitionConnectorTerms"
    DesktopMarketDataAcquisitionConnectorCatalog:
      type: object
      additionalProperties: false
      required:
        - connectors
      properties:
        connectors:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/DesktopMarketDataAcquisitionConnector"
    DesktopCcxtAcquisitionMarket:
      type: object
      additionalProperties: false
      required:
        - symbol
        - base
        - quote
        - active
      properties:
        symbol:
          type: string
          minLength: 3
          maxLength: 64
        base:
          type: string
          minLength: 1
          maxLength: 32
        quote:
          type: string
          minLength: 1
          maxLength: 32
        active:
          type: boolean
          const: true
    DesktopCcxtAcquisitionMarketCatalog:
      type: object
      additionalProperties: false
      required:
        - exchangeId
        - markets
        - cachedAt
      properties:
        exchangeId:
          type: string
          enum:
            - binance
            - okx
        markets:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/DesktopCcxtAcquisitionMarket"
        cachedAt:
          type: string
          format: date-time
          maxLength: 64
    DesktopAkshareAcquisitionInstrument:
      type: object
      additionalProperties: false
      required:
        - symbol
        - name
        - exchangeId
        - kind
      properties:
        symbol:
          type: string
          minLength: 6
          maxLength: 12
          pattern: "^(?:[0-9]{6}|INDEX-[0-9]{6})$"
        name:
          type: string
          minLength: 1
          maxLength: 128
        exchangeId:
          type: string
          enum:
            - SH
            - SZ
            - BJ
        kind:
          type: string
          enum:
            - A_SHARE
            - INDEX
    DesktopAkshareAcquisitionInstrumentCatalog:
      type: object
      additionalProperties: false
      required:
        - instruments
        - cachedAt
      properties:
        instruments:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            $ref: "#/components/schemas/DesktopAkshareAcquisitionInstrument"
        cachedAt:
          type: string
          format: date-time
          maxLength: 64
    DesktopAkshareDailyAcquisitionJobCreateRequest:
      type: object
      additionalProperties: false
      required:
        - connectorId
        - dataset
        - symbols
        - timeframe
        - startAt
        - endAt
        - adjustment
      properties:
        connectorId:
          type: string
          const: akshare
        dataset:
          type: string
          const: stock_zh_a_hist
        symbols:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 32
            pattern: "^[0-9]{6}$"
        timeframe:
          type: string
          const: 1d
        startAt:
          type: string
          format: date-time
          maxLength: 64
        endAt:
          type: string
          format: date-time
          maxLength: 64
        adjustment:
          type: string
          enum:
            - none
            - qfq
            - hfq
    DesktopAkshareMinuteAcquisitionJobCreateRequest:
      type: object
      additionalProperties: false
      required:
        - connectorId
        - dataset
        - symbols
        - timeframe
        - startAt
        - endAt
        - adjustment
      properties:
        connectorId:
          type: string
          const: akshare
        dataset:
          type: string
          const: stock_zh_a_hist_min_em
        symbols:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 32
            pattern: "^[0-9]{6}$"
        timeframe:
          type: string
          enum:
            - 1m
            - 5m
            - 1h
        startAt:
          type: string
          format: date-time
          maxLength: 64
        endAt:
          type: string
          format: date-time
          maxLength: 64
        adjustment:
          type: string
          enum:
            - none
            - qfq
            - hfq
    DesktopAkshareIndexDailyAcquisitionJobCreateRequest:
      type: object
      additionalProperties: false
      required:
        - connectorId
        - dataset
        - symbols
        - timeframe
        - startAt
        - endAt
        - adjustment
      properties:
        connectorId:
          type: string
          const: akshare
        dataset:
          type: string
          const: index_zh_a_hist
        symbols:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 12
            maxLength: 12
            pattern: "^INDEX-[0-9]{6}$"
        timeframe:
          type: string
          const: 1d
        startAt:
          type: string
          format: date-time
          maxLength: 64
        endAt:
          type: string
          format: date-time
          maxLength: 64
        adjustment:
          type: string
          const: none
    DesktopAkshareAcquisitionJobCreateRequest:
      oneOf:
        - $ref: "#/components/schemas/DesktopAkshareDailyAcquisitionJobCreateRequest"
        - $ref: "#/components/schemas/DesktopAkshareMinuteAcquisitionJobCreateRequest"
        - $ref: "#/components/schemas/DesktopAkshareIndexDailyAcquisitionJobCreateRequest"
    DesktopCcxtAcquisitionJobCreateRequest:
      type: object
      additionalProperties: false
      required:
        - connectorId
        - exchangeId
        - marketType
        - symbols
        - timeframe
        - startAt
        - endAt
      properties:
        connectorId:
          type: string
          const: ccxt
        exchangeId:
          type: string
          enum:
            - binance
            - okx
        marketType:
          type: string
          const: spot
        symbols:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 3
            maxLength: 64
            pattern: "^[A-Z0-9._-]+/[A-Z0-9._-]+$"
        timeframe:
          $ref: "#/components/schemas/DesktopMarketDataAcquisitionTimeframe"
        startAt:
          type: string
          format: date-time
          maxLength: 64
        endAt:
          type: string
          format: date-time
          maxLength: 64
    DesktopMarketDataAcquisitionJobCreateRequest:
      oneOf:
        - $ref: "#/components/schemas/DesktopAkshareAcquisitionJobCreateRequest"
        - $ref: "#/components/schemas/DesktopCcxtAcquisitionJobCreateRequest"
    DesktopMarketDataAcquisitionJobProgress:
      type: object
      additionalProperties: false
      required:
        - stage
        - completedSymbols
        - totalSymbols
        - retryAttempt
        - retryAfterMs
      properties:
        stage:
          type: string
          enum:
            - QUEUED
            - CONNECTING
            - DOWNLOADING
            - NORMALIZING
            - VALIDATING
            - RETRY_WAIT
            - READY_TO_SAVE
        completedSymbols:
          type: integer
          minimum: 0
          maximum: 20
        totalSymbols:
          type: integer
          minimum: 1
          maximum: 20
        retryAttempt:
          type: integer
          minimum: 0
          maximum: 3
        retryAfterMs:
          type: integer
          minimum: 0
          maximum: 10000
    DesktopMarketDataAcquisitionStagingSummary:
      type: object
      additionalProperties: false
      required:
        - fileCount
        - totalBytes
        - manifestSha256
        - outputFolderName
      properties:
        fileCount:
          type: integer
          minimum: 2
          maximum: 21
        totalBytes:
          type: integer
          minimum: 1
        manifestSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        outputFolderName:
          type: string
          minLength: 1
          maxLength: 128
    DesktopMarketDataAcquisitionJobError:
      type: object
      additionalProperties: false
      required:
        - code
        - args
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 128
        args:
          type: object
          additionalProperties: true
          x-zinuto-zod-allow-additional-properties: true
    DesktopMarketDataAcquisitionJob:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - connectorId
        - request
        - progress
        - staging
        - error
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: "#/components/schemas/BoundedId"
        status:
          type: string
          enum:
            - QUEUED
            - RUNNING
            - READY_TO_SAVE
            - FAILED
            - CANCELED
        connectorId:
          type: string
          enum:
            - akshare
            - ccxt
        request:
          $ref: "#/components/schemas/DesktopMarketDataAcquisitionJobCreateRequest"
        progress:
          $ref: "#/components/schemas/DesktopMarketDataAcquisitionJobProgress"
        staging:
          $ref: "#/components/schemas/DesktopMarketDataAcquisitionStagingSummary"
          nullable: true
        error:
          $ref: "#/components/schemas/DesktopMarketDataAcquisitionJobError"
          nullable: true
        createdAt:
          type: string
          format: date-time
          maxLength: 64
        updatedAt:
          type: string
          format: date-time
          maxLength: 64
    DesktopMarketDataAcquisitionDiscardResult:
      type: object
      additionalProperties: false
      required:
        - discarded
      properties:
        discarded:
          type: boolean
    DesktopWorkspaceId:
      type: string
      enum:
        - command-center
        - trainer
        - history-review-console
        - challenge-stats
        - special-training
        - data-management
        - notes
        - settings
        - custom-indicator
        - strategy-backtest
    DesktopWorkspaceReadModelTone:
      type: string
      enum:
        - neutral
        - ready
        - loading
        - warning
        - danger
        - locked
    DesktopWorkspaceCopyRef:
      type: object
      required:
        - copyKey
      properties:
        copyKey:
          type: string
          minLength: 1
          maxLength: 128
        copyArgs:
          type: array
          maxItems: 16
          items:
            oneOf:
              - type: string
              - type: number
              - type: boolean
      additionalProperties: false
    DesktopWorkspaceReadModelAction:
      type: object
      required:
        - id
        - enabled
        - reasonCode
        - priority
      properties:
        id:
          $ref: "#/components/schemas/BoundedId"
        enabled:
          type: boolean
        reasonCode:
          type: string
          nullable: true
        priority:
          type: integer
          minimum: 0
          maximum: 100
        copy:
          $ref: "#/components/schemas/DesktopWorkspaceCopyRef"
        facts:
          type: object
          additionalProperties: true
          x-zinuto-zod-allow-additional-properties: true
      additionalProperties: false
    DesktopWorkspaceReadModelSection:
      type: object
      required:
        - id
        - statusCode
        - reasonCode
        - tone
        - priority
        - facts
        - actions
      properties:
        id:
          $ref: "#/components/schemas/BoundedId"
        statusCode:
          type: string
          minLength: 1
          maxLength: 64
        reasonCode:
          type: string
          nullable: true
        tone:
          $ref: "#/components/schemas/DesktopWorkspaceReadModelTone"
        priority:
          type: integer
          minimum: 0
          maximum: 100
        copy:
          $ref: "#/components/schemas/DesktopWorkspaceCopyRef"
        facts:
          type: object
          additionalProperties: true
          x-zinuto-zod-allow-additional-properties: true
        actions:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/DesktopWorkspaceReadModelAction"
      additionalProperties: false
    DesktopWorkspaceReadModel:
      type: object
      required:
        - workspaceId
        - generatedAt
        - statusCode
        - reasonCode
        - tone
        - priority
        - facts
        - actions
        - sections
      properties:
        workspaceId:
          $ref: "#/components/schemas/DesktopWorkspaceId"
        generatedAt:
          type: string
          format: date-time
        statusCode:
          type: string
          minLength: 1
          maxLength: 64
        reasonCode:
          type: string
          nullable: true
        tone:
          $ref: "#/components/schemas/DesktopWorkspaceReadModelTone"
        priority:
          type: integer
          minimum: 0
          maximum: 100
        copy:
          $ref: "#/components/schemas/DesktopWorkspaceCopyRef"
        facts:
          type: object
          additionalProperties: true
          x-zinuto-zod-allow-additional-properties: true
        actions:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/DesktopWorkspaceReadModelAction"
        sections:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/DesktopWorkspaceReadModelSection"
      additionalProperties: false
    DesktopReleaseChannel:
      type: string
      enum:
        - community
    DesktopLegalDocumentKey:
      type: string
      enum:
        - privacy
        - terms
    DesktopLegalDocumentLocale:
      type: string
      enum:
        - en
        - zh-CN
        - ja
        - ko
        - es
    DesktopLegalDocumentCacheStatus:
      type: string
      enum:
        - local
    DesktopLegalDocument:
      type: object
      required:
        - documentKey
        - locale
        - documentVersion
        - lastUpdated
        - effectiveDate
        - markdown
        - sourceUrl
        - cacheStatus
        - fetchedAt
        - checkedAt
      properties:
        documentKey:
          $ref: "#/components/schemas/DesktopLegalDocumentKey"
        locale:
          $ref: "#/components/schemas/DesktopLegalDocumentLocale"
        documentVersion:
          type: string
          minLength: 1
          maxLength: 64
        lastUpdated:
          type: string
          minLength: 1
          maxLength: 64
        effectiveDate:
          type: string
          minLength: 1
          maxLength: 64
        markdown:
          type: string
          minLength: 1
          maxLength: 100000
        sourceUrl:
          type: string
          minLength: 1
          maxLength: 8192
        cacheStatus:
          $ref: "#/components/schemas/DesktopLegalDocumentCacheStatus"
        fetchedAt:
          type: string
          minLength: 1
          maxLength: 64
        checkedAt:
          type: string
          minLength: 1
          maxLength: 64
      additionalProperties: false
    DesktopSystemDevSimulationTargets:
      type: object
      required:
        - freeReplayTarget
        - fastDecisionTarget
        - riskDisciplineTarget
        - independentCustomNotes
        - customIndicatorProfiles
        - realBacktestBatches
      additionalProperties: false
      properties:
        freeReplayTarget:
          type: integer
          minimum: 0
          maximum: 3000
        fastDecisionTarget:
          type: integer
          minimum: 0
          maximum: 600
        riskDisciplineTarget:
          type: integer
          minimum: 0
          maximum: 600
        independentCustomNotes:
          type: integer
          minimum: 0
          maximum: 500
        customIndicatorProfiles:
          type: integer
          minimum: 0
          maximum: 1000
        realBacktestBatches:
          type: integer
          minimum: 0
          maximum: 500
    DesktopSystemDevSimulationStartRequest:
      type: object
      required:
        - profileId
        - repeatMode
        - seed
        - targets
      additionalProperties: false
      properties:
        profileId:
          type: string
          enum:
            - REALISTIC
            - STRESS
        repeatMode:
          type: string
          enum:
            - REPLACE
            - APPEND
        seed:
          type: string
          minLength: 1
          maxLength: 128
        targets:
          $ref: "#/components/schemas/DesktopSystemDevSimulationTargets"
    BoundedSymbol:
      type: string
      minLength: 1
      maxLength: 32
    BacktestBatchStatus:
      type: string
      enum:
        - DRAFT
        - QUEUED
        - RUNNING
        - SUCCEEDED
        - FAILED
        - CANCELLED
    BacktestOrderSizingMode:
      type: string
      enum:
        - FIXED_QTY
        - FIXED_AMOUNT
        - EQUITY_PERCENT
        - ALL_IN
    BacktestOrderSizing:
      type: object
      required:
        - mode
      properties:
        mode:
          $ref: "#/components/schemas/BacktestOrderSizingMode"
        value:
          type: number
          minimum: 0
      additionalProperties: false
    BacktestSignalRuleOperand:
      oneOf:
        - type: object
          required:
            - kind
            - key
          properties:
            kind:
              type: string
              enum:
                - OUTPUT
            key:
              type: string
              minLength: 1
              maxLength: 64
              pattern: ^[A-Z_][A-Z0-9_]*$
          additionalProperties: false
        - type: object
          required:
            - kind
            - field
          properties:
            kind:
              type: string
              enum:
                - PRICE
            field:
              type: string
              enum:
                - CLOSE
                - OPEN
                - HIGH
                - LOW
                - VOLUME
          additionalProperties: false
        - type: object
          required:
            - kind
            - value
          properties:
            kind:
              type: string
              enum:
                - CONSTANT
            value:
              type: number
          additionalProperties: false
    BacktestSignalRuleOperator:
      type: string
      enum:
        - CROSS_ABOVE
        - CROSS_BELOW
        - GREATER
        - GREATER_EQUAL
        - LESS
        - LESS_EQUAL
        - EQUAL
    BacktestSignalRuleCondition:
      type: object
      required:
        - left
        - operator
        - right
      properties:
        left:
          $ref: "#/components/schemas/BacktestSignalRuleOperand"
        operator:
          $ref: "#/components/schemas/BacktestSignalRuleOperator"
        right:
          $ref: "#/components/schemas/BacktestSignalRuleOperand"
      additionalProperties: false
    BacktestDirectionSignalRule:
      type: object
      required:
        - connector
        - conditions
      properties:
        connector:
          type: string
          enum:
            - AND
            - OR
        conditions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/BacktestSignalRuleCondition"
      additionalProperties: false
    BacktestSignalRules:
      type: object
      properties:
        buy:
          $ref: "#/components/schemas/BacktestDirectionSignalRule"
        sell:
          $ref: "#/components/schemas/BacktestDirectionSignalRule"
        short:
          $ref: "#/components/schemas/BacktestDirectionSignalRule"
        cover:
          $ref: "#/components/schemas/BacktestDirectionSignalRule"
      additionalProperties: false
    BacktestTradingSettings:
      type: object
      required:
        - assetClass
        - marketPresetId
        - minTradeStep
        - initialSecuritiesBalance
        - allowShortSelling
        - tradeSettlementMode
        - freeReplayEndSettlementMode
      properties:
        assetClass:
          type: string
          enum:
            - STOCK
            - FUTURES
            - FOREX
            - CRYPTO
        marketPresetId:
          type: string
          minLength: 1
          maxLength: 48
        minTradeStep:
          type: number
          exclusiveMinimum: 0
        initialSecuritiesBalance:
          type: number
          exclusiveMinimum: 0
        allowShortSelling:
          type: boolean
        tradeSettlementMode:
          type: string
          enum:
            - T0
            - T1
        freeReplayEndSettlementMode:
          type: string
          enum:
            - FORCE_CLOSE
            - CURRENT_TOTAL_ASSET
      additionalProperties: true
      x-zinuto-zod-allow-additional-properties: true
    BacktestConfig:
      type: object
      required:
        - strategySource
        - initialCapital
        - orderSizing
        - tradingSettings
      properties:
        name:
          type: string
          maxLength: 64
        strategySource:
          type: string
          minLength: 1
          maxLength: 65536
        parameterInputs:
          type: object
          additionalProperties:
            type: string
            maxLength: 128
        instrumentIds:
          type: array
          maxItems: 20000
          items:
            $ref: "#/components/schemas/BoundedId"
        samplePoolIds:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/BoundedId"
        startIndex:
          type: integer
          minimum: 0
        endIndex:
          type: integer
          minimum: 0
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
