[package]
name = "open-trading-practice-backtest-engine"
version = "2.0.1"
edition = "2021"
license = "GPL-3.0-only"

[[bin]]
name = "open-trading-practice-backtest-engine"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
duckdb = "1.10503.1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
